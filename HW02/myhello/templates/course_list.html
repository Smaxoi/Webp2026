<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .course-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        .course-link:hover {
            text-decoration: underline;
        }

        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #999;
            padding: 10px;
        }

        th {
            background-color: #04AA6D;
            color: white;
            text-align: left;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        td {
            word-break: break-word;
        }

        .btn-area {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h2>資工選課表</h2>

<table id="csie">
    <tr>
        <th>開課單位</th>
        <th>開課名稱</th>
        <th>授課教師</th>
    </tr>

    {% for c in courses %}
    <tr>
        <td>{{ c.department }}</td>
        <td>
            <a class="course-link"
               href="https://catalog.cgu.edu.tw/coursedata?sectionid={{ c.sectionid }}"
               target="_blank">
               {{ c.course_title }}
            </a>
        </td>
        <td>{{ c.instructor }}</td>
    </tr>
    {% endfor %}
</table>

<div class="btn-area">
    <button onclick="changeResult()">Change</button>
</div>

<script>
function changeResult() {
    var myTable = document.getElementById("csie");
    myTable.rows[1].cells[2].innerHTML = "李春良";
}
</script>

</body>
</html>
